name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Run checks
        run: |
          for test in tests/*.sh; do bash "$test" || exit 1; done
          # Build the runner's native target. Cross-system target coverage is
          # exercised by the evaluation tests above; --all-systems attempts
          # to build Linux on the ARM macOS runner and fails with a platform
          # mismatch.
          nix --extra-experimental-features 'nix-command flakes' flake check
